<svg width="920" height="240" viewBox="0 0 920 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>BARANA – primary logo</title>
  <desc>Primary horizontal logo with architectural structure mark and gold accent.</desc>

  <defs>
    <style>
      .word { font-family: Inter, Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: 0.08em; }
      .tag  { font-family: Inter, Arial, Helvetica, sans-serif; font-weight: 500; letter-spacing: 0.18em; }
    </style>
  </defs>

  <!-- Symbol -->
  <g transform="translate(40 48)">
    <!-- Gold roof line / premium accent -->
    <path d="M14 34L92 0L170 34" stroke="#D4A853" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Structural posts -->
    <rect x="42" y="52" width="18" height="76" rx="4" fill="#111111"/>
    <rect x="82" y="52" width="18" height="76" rx="4" fill="#111111"/>
    <rect x="122" y="52" width="18" height="76" rx="4" fill="#111111"/>

    <!-- Base beam -->
    <rect x="24" y="136" width="134" height="10" rx="5" fill="#111111"/>

    <!-- subtle negative rhythm -->
    <rect x="64" y="70" width="10" height="40" rx="3" fill="white"/>
    <rect x="104" y="70" width="10" height="40" rx="3" fill="white"/>
  </g>

  <!-- Wordmark -->
  <text x="255" y="132" class="word" font-size="86" fill="#111111">BARANA</text>

  <!-- Optional descriptor -->
  <line x1="259" y1="170" x2="302" y2="170" stroke="#D4A853" stroke-width="3" stroke-linecap="round"/>
  <text x="320" y="178" class="tag" font-size="24" fill="#4C4A45">Hliníkové pergoly • brány • ploty</text>
</svg>

        description: >-
          A short animation promoting Pitbike Akademie on social
          media. The goal is simple: stop the thumb mid-scroll and
          deliver the main message in a few seconds — because that's
          exactly the window where viewers decide whether to keep
          watching.
        challenge: >-
          Social feeds are saturated. A static image isn't enough; a

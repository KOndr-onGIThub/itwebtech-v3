    translations:
      cs:
        title: "Nové interiéry"
        subtitle: "Web jako první obchodní schůzka, ne katalog"
        summary: "Redesign webu showroomu podlah, dveří a interiérů. Místo „pěkného obrázku\" funkční nástroj, který nezájemce odfiltruje dřív, než zavolá."
        description: >-
          Petr Kroulík provozuje showroom s podlahami, dveřmi a interiéry.
          Patnáct let starý web odrazoval lidi, kteří by se jinak rádi
          stavili. Postavil jsem redesign od nuly — návrh, copy, struktura.
          Cílem nebylo „mít hezký web", ale aby web fungoval jako první
          obchodní schůzka.
        challenge: >-
          Původní web vypadal jako levný katalog. Klienti hledající
          prémiový showroom z něj odcházeli, návštěvy končily bez
          poptávky a klient sám přiznával, že kvalitu jeho služby ten
          web nepřesvědčivě podává. Bylo potřeba weby ostatních
          (typicky šablony a katalogové weby) jasně přebít a získat
          klientův důvěryhodný hlas.
        solution: >-
          Web vede zákazníka od inspirace ke konkrétní akci. Šíře řešení (podlahy,
          dveře, interiéry) je čitelná, ale nezahlcuje. Texty bez žargonu říkají,
          co klient od spolupráce dostane. Vizuální styl odpovídá kvalitě
          showroomu — nic „rádobyluxusního". Web je první kontakt s firmou a má
          tomu odpovídat.
        result: >-
          Klient zpětně mluví o lepší věrohodnosti značky a o tom, že
          zákazníci dopředu vědí, jak spolupráce probíhá. Část
          poptávek, které dřív skončily ztrátou času na obou stranách,
          web předem odfiltruje. Pozitivní zpětná vazba se týkala
          zejména designu, přehlednosti a celkového UX.
        outcomes:
          - "Web vystupuje jako první obchodní schůzka"
          - "Předem odfiltrované irelevantní poptávky"
          - "Vizuál odpovídá kvalitě fyzického showroomu"
          - "Texty bez jargonu — zákazník chápe, co dostane"
          - "Klient potvrzuje vyšší důvěryhodnost značky"
        meta_title: "Nové interiéry — redesign webu showroomu podlah a dveří"
        meta_description: "Případová studie: redesign webu Nové interiéry. Web jako první obchodní schůzka, který filtruje vážné zájemce o showroom."
      en:
        title: "Nové interiéry"
        subtitle: "A website that works like a first business meeting"
        summary: "Redesign for a flooring, doors and interior showroom. A functional tool that filters serious enquiries — not just another pretty page."
        description: >-
          Petr Kroulík runs a showroom for flooring, doors and interiors.
          The 15-year-old website was driving away the customers who
          would have otherwise dropped by. I rebuilt the site from
          scratch — design, copy, structure. The goal wasn't a "nice
          website"; it was a site that functions like a first business
          meeting.
        challenge: >-
          The original site looked like a budget catalogue. Clients
          looking for a premium showroom left without making contact,
          and the owner himself admitted the site failed to communicate
          the quality of his service. It needed to clearly outclass
          template-based catalogue sites and bring the client's
          trustworthy voice forward.
        solution: >-
          The site walks visitors from inspiration to a concrete action.
          The breadth of work (flooring, doors, interiors) is clear
          without overwhelming. Copy avoids jargon and explains what the
          client actually receives in cooperation. The visual style
          matches the showroom's real quality — no "fake luxury". The
          website is the first touchpoint with the business, and it
          should look like one.
        result: >-
          The client now speaks about higher brand credibility and
          customers arriving informed about how the collaboration works.
          Enquiries that used to waste time on both sides are now
          filtered upfront. Positive feedback focused on design, clarity
          and overall UX.
        outcomes:
          - "The website behaves like a first business meeting"
          - "Irrelevant enquiries filtered out upfront"
          - "Visual quality matches the physical showroom"
          - "Jargon-free copy — customers understand what they get"
          - "Client reports higher brand credibility"
        meta_title: "Nové interiéry — flooring & doors showroom website redesign"
        meta_description: "Case study: Nové interiéry website redesign. A site that works like a first business meeting and filters serious enquiries."
      de:
        title: "Nové interiéry"
        subtitle: "Eine Website, die wie ein erstes Verkaufsgespräch wirkt"
        summary: "Redesign für einen Showroom für Böden, Türen und Interieurs. Ein funktionales Werkzeug, das ernsthafte Anfragen filtert — kein hübsches Schaufenster."
        description: >-
          Petr Kroulík betreibt einen Showroom für Böden, Türen und
          Interieurs. Die 15 Jahre alte Website vertrieb genau die
          Kunden, die sonst gerne vorbeigeschaut hätten. Ich habe sie
          komplett neu gebaut — Design, Texte, Struktur. Ziel war nicht
          „eine schöne Website", sondern eine Site, die wie ein erstes
          Geschäftstreffen funktioniert.
        challenge: >-
          Der ursprüngliche Auftritt wirkte wie ein Billigkatalog.
          Kunden auf der Suche nach einem Premium-Showroom waren weg,
          und der Inhaber gab selbst zu, dass die Qualität seines
          Service nicht ankommt. Die neue Website musste sich klar von
          Template-Katalogen abheben und die glaubwürdige Stimme des
          Kunden in den Vordergrund stellen.
        solution: >-
          Die Site führt Besucher von der Inspiration zur konkreten
          Handlung. Die Breite (Böden, Türen, Interieurs) ist sichtbar,
          ohne zu überfordern. Texte verzichten auf Jargon und erklären,
          was der Kunde aus der Zusammenarbeit bekommt. Der visuelle
          Stil entspricht der echten Qualität des Showrooms — kein
          „Möchtegern-Luxus". Die Website ist der erste Kontakt mit
          dem Unternehmen — und sieht auch so aus.
        result: >-
          Der Kunde berichtet von höherer Markenglaubwürdigkeit und
          Kunden, die informiert eintreten. Anfragen, die früher beide
          Seiten Zeit kosteten, werden vorab gefiltert. Positives

  # 1b) PitArena e-shop — shop.pitarena.cz (OND-208)
  #     Texty ze schváleného dokumentu `pripadovky` (OND-186 §1), čísla
  #     výhradně z `namerena-cisla` (OND-206 §1). Mobilní skóre 87/100
  #     (rozptyl 81–91) se dle omezení QA nepublikuje.
  # ----------------------------------------------------------------------
  - slug: pitarena-eshop
    category: website
    client_name: PitArena
    live_url: https://shop.pitarena.cz
    year: 2026  # spuštěno 1. 7. 2026 (OND-224, potvrdil Ondra)
    duration: null
    featured: true
    sort_order: 15
    # Jen štítky, které v DB už existují. Nový slug (`e-shop`, `katalog`) by
    # seeder pojmenoval přes humanizeSlug na „E shop" / „Katalog" — tedy ten
    # samý žargon, který opravovala migrace z OND-198.
    tags: [web, motocykly]
    # OND-256 bod 6: e-shop byl jediný projekt bez obrázku — chyběl na kartě
    # v /projekty, v hero detailu i v kartách „Další projekty". Snímek je
    # vlastní záběr shop.pitarena.cz (22. 9. 2026), ne externí URL, proto tu
    # `url` chybí a `path` míří rovnou do resources/img.
    screenshots_source:
      - path: "projects/pitarena-eshop/hero-1.webp"
        type: hero
        alt:
          cs: "PitAréna – e-shop s pitbike motorkami YCF a náhradními díly"
          en: "PitArena – e-shop with YCF pit bikes and spare parts"
          de: "PitArena – Onlineshop mit YCF-Pitbikes und Ersatzteilen"
    translations:
      cs:
        title: "PitArena — e-shop"
        subtitle: "E-shop, kde zákazník najde díl na svůj model a ročník"
        summary: "E-shop s pitbike motorkami YCF a náhradními díly. Díly roztříděné podle modelů a skupin, filtrování podle modelu a ročníku."
        description: >-
          Klient prodává pitbike motorky YCF a náhradní díly. Potřeboval prodávat
          online — a u dílů je klíčové poskládat správný kus pro daný model a
          ročník. Postavil jsem e-shop s katalogem motorek i dílů, roztříděných
          podle modelů a skupin.
        challenge: >-
          U náhradních dílů nestačí seznam produktů. Zákazník potřebuje jistotu, že
          díl sedne na jeho model a ročník — jinak nakupuje naslepo a vrací. Katalog
          o tisícových počtech položek musel zůstat průchodný, ne se z něj stát
          nekonečný seznam.
        solution: >-
          Postavil jsem e-shop s katalogem motorek i dílů. Díly jsou roztříděné
          podle modelů (LITE 125, PILOT 125, Factory 190) a skupin — brzdy, motory,
          tlumiče, elektrika. K tomu filtrování podle modelu a ročníku, košík a
          zákaznický účet, oblíbené položky a porovnání produktů.
        result: >-
          E-shop dnes nabízí 4 551 produktů v 695 kategoriích a katalog náhradních
          dílů rozpadnutý podle 19 modelů motocyklů YCF — zákazník klikne na svůj
          model a vidí jen díly, které na něj sedí. I s tímhle rozsahem drží na
          desktopu 99/100 v Lighthouse Performance a hlavní obsah se vykreslí do 0,9
          s (měřeno lokálním Lighthouse 13.4.1, 16. 9. 2026). Za první dva a půl
          měsíce provozu (1. 7. – 17. 9. 2026) jím prošlo 116 objednávek za 468 202
          Kč, průměrná objednávka 4 036 Kč (údaje z administrace e-shopu).
        outcomes:
          - "4 551 produktů v 695 kategoriích"
          - "Katalog náhradních dílů podle 19 modelů motocyklů YCF"
          - "Filtrování podle modelu a ročníku"
          - "Košík, zákaznický účet, oblíbené položky a porovnání produktů"
          - "99/100 v Lighthouse Performance na desktopu (měřeno 16. 9. 2026)"
          - "116 objednávek za 468 202 Kč za první dva a půl měsíce provozu (1. 7. – 17. 9. 2026)"
        meta_title: "PitArena — e-shop s motorkami YCF a náhradními díly"
        meta_description: "Případová studie: e-shop se 4 551 produkty v 695 kategoriích. Náhradní díly roztříděné podle 19 modelů YCF, filtrování podle modelu a ročníku."
      en:
        slug: "pitarena-online-shop"   # OND-209: lokalizovaný slug
        title: "PitArena — online shop"
        subtitle: "An online shop where customers find the part for their model and year"
        summary: "Online shop for YCF pitbikes and spare parts. Parts sorted by model and group, with filtering by model and year."
        description: >-
          The client sells YCF pitbikes and spare parts and needed to sell online —
          and with parts, the crucial thing is matching the right piece to the model
          and year. I built an online shop with a catalogue of both bikes and parts,
          sorted by model and group.
        challenge: >-
          With spare parts, a product list is not enough. The customer needs
          certainty that a part fits their model and year — otherwise they buy blind
          and send it back. A catalogue running into thousands of items had to stay
          navigable instead of turning into an endless list.
        solution: >-
          I built an online shop with a catalogue of bikes and parts. Parts are
          sorted by model (LITE 125, PILOT 125, Factory 190) and by group — brakes,
          engines, suspension, electrics. Plus filtering by model and year, a cart
          and customer account, favourites and product comparison.
        result: >-
          The shop now offers 4,551 products in 695 categories, with the spare-parts
          catalogue broken down across 19 YCF motorcycle models — the customer
          clicks their model and sees only parts that fit. Even at that scale it
          holds 99/100 in Lighthouse Performance on desktop, with the main content
          rendering in under 0.9 s (measured with local Lighthouse 13.4.1 on 16
          September 2026). In its first two and a half months (1 July – 17 September
          2026) it handled 116 orders worth CZK 468,202 in total, averaging CZK
          4,036 per order (figures from the shop administration).
        outcomes:
          - "4,551 products in 695 categories"
          - "Spare-parts catalogue split across 19 YCF motorcycle models"
          - "Filtering by model and year"
          - "Cart, customer account, favourites and product comparison"
          - "99/100 in Lighthouse Performance on desktop (measured 16 September 2026)"
          - "116 orders worth CZK 468,202 in the first two and a half months (1 July – 17 September 2026)"
        meta_title: "PitArena — online shop for YCF pitbikes and spare parts"
        meta_description: "Case study: an online shop with 4,551 products in 695 categories. Spare parts split across 19 YCF models, filtering by model and year."
      de:
        slug: "pitarena-onlineshop"   # OND-209: lokalizovaný slug
        title: "PitArena — Onlineshop"
        subtitle: "Ein Shop, in dem Kunden das Teil für Modell und Baujahr finden"
        summary: "Onlineshop für YCF-Pitbikes und Ersatzteile. Teile nach Modellen und Gruppen sortiert, mit Filter nach Modell und Baujahr."
        description: >-
          Der Kunde verkauft YCF-Pitbikes und Ersatzteile und wollte online
          verkaufen — bei Teilen ist entscheidend, das richtige Stück für Modell und
          Baujahr zu treffen. Ich habe einen Onlineshop mit Katalog für Motorräder
          und Teile gebaut, sortiert nach Modellen und Gruppen.
        challenge: >-
          Bei Ersatzteilen genügt eine Produktliste nicht. Kunden brauchen die
          Sicherheit, dass ein Teil auf ihr Modell und Baujahr passt — sonst kaufen
          sie blind und schicken zurück. Ein Katalog mit Tausenden Positionen musste
          begehbar bleiben, statt zur endlosen Liste zu werden.
        solution: >-
          Ich habe einen Onlineshop mit Katalog für Motorräder und Teile gebaut. Die
          Teile sind nach Modellen (LITE 125, PILOT 125, Factory 190) und Gruppen
          sortiert — Bremsen, Motoren, Federung, Elektrik. Dazu Filter nach Modell
          und Baujahr, Warenkorb und Kundenkonto, Favoriten und Produktvergleich.
        result: >-
          Der Shop bietet heute 4.551 Produkte in 695 Kategorien, der
          Ersatzteilkatalog ist nach 19 YCF-Motorradmodellen aufgeteilt — Kunden
          klicken ihr Modell an und sehen nur passende Teile. Auch in dieser Größe
          hält er auf dem Desktop 99/100 in Lighthouse Performance, der Hauptinhalt
          erscheint in unter 0,9 s (gemessen mit lokalem Lighthouse 13.4.1 am
          16.09.2026). In den ersten zweieinhalb Monaten (1.7. – 17.9.2026) wickelte
          er 116 Bestellungen im Gesamtwert von 468.202 CZK ab, im Schnitt 4.036 CZK
          pro Bestellung (Daten aus der Shop-Administration).
        outcomes:
          - "4.551 Produkte in 695 Kategorien"
          - "Ersatzteilkatalog nach 19 YCF-Motorradmodellen aufgeteilt"
          - "Filter nach Modell und Baujahr"
          - "Warenkorb, Kundenkonto, Favoriten und Produktvergleich"
          - "99/100 in Lighthouse Performance auf dem Desktop (gemessen 16.09.2026)"
          - "116 Bestellungen im Wert von 468.202 CZK in den ersten zweieinhalb Monaten (1.7. – 17.9.2026)"
        meta_title: "PitArena — Onlineshop für YCF-Pitbikes und Ersatzteile"
        meta_description: "Case Study: Onlineshop mit 4.551 Produkten in 695 Kategorien. Ersatzteile nach 19 YCF-Modellen aufgeteilt, Filter nach Modell und Baujahr."

        description: >-
          Picker steuert das Kommissionieren von Teilen aus dem Lager
          und ihre Lieferung ans Montageband. Sie führt den Mitarbeiter
          Schritt für Schritt am Bildschirm, unterstützt Barcode-
          Scanner, misst Operationszeiten und gibt der Teamleitung
          Echtzeit-Überblick. Gebaut für den Werksboden.
        challenge: >-
          Kommissionieren muss schnell und fehlerfrei laufen — Fehler
          bedeuten Rückweg ins Regal, Verzögerung, Bandstillstand.

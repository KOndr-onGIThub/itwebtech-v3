          The redesign goal was clear: take the site to a state where
          it grows organically the moment the company starts producing
          content. Competitor analysis, keywords, copy and structure
          are now in place — the technical foundation is done.
        challenge: >-
          The client wanted a site set up for long-term organic growth, not a
          few-month marketing burst. The job was to understand the competitive
          landscape, define keywords, and build content and architecture that would
          not block that growth.

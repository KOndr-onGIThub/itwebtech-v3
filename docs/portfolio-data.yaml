        description: >-
          Magda Pernicová Novotná does real estate with a personal touch
          and wanted a site to match. I built a custom solution with no
          template lock-in and no monthly fees — online appointment
          booking, property management, a blog, and branding that
          carries the same spirit as her work.
        challenge: >-
          The agent needed a site that wasn't just "a WordPress business
          card" and didn't generate monthly costs. It had to feel
          professional yet personal and show how she actually works.
          Some listings lacked quality photos, and she wasn't a tech
          user — the system had to be self-explanatory.
        solution: >-
          The site is hand-coded with no template CMS. The client has
          an admin for properties, enquiries and the blog, so she
          updates everything herself. Added a Reservanto-based booking
          system, two intro blog articles, and stock photography to
          fill in for missing imagery. Branding, keyword research and
          SEO structure rounded it out.
        result: >-
          The client has a website that works for her 24/7 with zero
          recurring fees. She links to it in conversations and updates
          properties and articles on her own. Her review describes a
          professional yet human approach and someone who actually
          listened to what she needed.
        outcomes:
          - "Custom site, no templates, no monthly fees"
          - "Online appointment booking via Reservanto"
          - "Self-service admin for properties, enquiries and blog"
          - "Branding, copy and SEO built alongside the site"
          - "5/5 star Google review"
        meta_title: "Realiťačky v Akci — custom real-estate website with booking"
        meta_description: "Case study: custom website for a real-estate agent — no WordPress, online appointment booking, self-service admin."
      de:
        title: "Realiťačky v Akci"
        subtitle: "Eine Immobilien-Website, die die Kundin selbst pflegt"
        summary: "Individuelle Website für eine Immobilienmaklerin — kein WordPress, keine monatlichen Gebühren. Termin-Buchung, Objekte und Blog managt die Kundin selbst."
        description: >-
          Magda Pernicová Novotná macht Immobilien menschlich und wollte
          eine Website, die das widerspiegelt. Ich habe eine individuelle
          Lösung ohne Template-Bindung und ohne monatliche Kosten gebaut —
          Online-Terminbuchung, Objektverwaltung, Blog und ein Branding
          im gleichen Geist wie ihre Arbeit.
        challenge: >-
          Die Maklerin brauchte einen Auftritt, der nicht „eine WordPress-
          Visitenkarte" ist und keine laufenden Kosten erzeugt. Er sollte
          professionell und gleichzeitig persönlich wirken und ihre
          Arbeitsweise zeigen. Einige Objekte hatten keine guten Fotos,
          und die Kundin war kein Tech-User — das System musste sich
          selbst erklären.
        solution: >-
          Die Site ist von Grund auf gecodet, kein Template-CMS. Die
          Kundin hat ein Admin für Objekte, Anfragen und Blog und
          aktualisiert alles selbst. Dazu ein Reservanto-Buchungssystem,
          zwei Einführungsartikel und Stock-Fotos, wo eigene Bilder
          fehlten. Branding, Keyword-Analyse und SEO-Struktur runden
          das Ganze ab.
        result: >-
          Die Kundin hat eine Website, die 24/7 für sie arbeitet — ohne
          laufende Kosten. Sie verlinkt sie aktiv und aktualisiert
          Objekte und Artikel selbst. In der Bewertung beschreibt sie
          einen professionellen und gleichzeitig menschlichen Ansatz
          und jemanden, der wirklich zugehört hat.
        outcomes:

        title: "Cyklocentrum Březí"
        subtitle: "Záchrana po neúspěšném webaři, postaveno znovu od nuly"
        summary: "Web cykloservisu a půjčovny, který klient potřeboval znovu — předchozí dodavatel rok pracoval a zanechal po sobě polotovar. Na klíčové lokální dotazy je dnes web v Googlu první."
        description: >-
          Cyklocentrum Březí nabízí servis kol, půjčovnu a prodej. Po roce
          práce s předchozím dodavatelem skončili s rozjetým, ale
          nepoužitelným webem, který lidi spíš odpuzoval. Postavil
          jsem náhradu znovu od nuly — analýza, struktura, copy, SEO,
          správa produktů a externí propagace.
        challenge: >-
          Předchozí webař rok něco stavěl, ale výsledek poškozoval
          dobrou pověst, kterou si klient budoval offline. Lidé
          dokonce volali, jestli ještě podnik funguje. Záchrana
          starého webu nedávala smysl — bylo levnější a bezpečnější
          udělat ho znovu pořádně.
        solution: >-
          Začal jsem analýzou klientova podnikání a pohledem na domácí i zahraniční
          konkurenci. Navrhl jsem strukturu, copy a vlastní design, vše ručně
          kódované kvůli robustnosti a rychlosti. Doplnil jsem správu produktů
          (klient si sám aktualizuje sortiment), Google Maps profil a propagační
          článek na Kudy z nudy. Web teď odpovídá kvalitě servisu, který nabízí.
        result: >-
          Na dotazy jako „cyklocentrum březí" nebo „půjčovna kol březí" je web v
          Googlu na první pozici a průměrná pozice napříč dotazy se zvedla z 16,8
          na 8,6 (Search Console, 16. 5. 2025 – 13. 9. 2026). Z Googlu tak
          přichází víc než polovina veškeré návštěvnosti — 1 780 z 3 149 návštěv
          (Google Analytics, 1. 1. – 16. 9. 2026). Klient potvrzuje, že má konečně
          prezentaci, za kterou se nemusí stydět. Návštěvník rychle najde, co se
          dá nechat opravit, co se dá půjčit a jak se s klientem spojit.
        outcomes:
          - "První nové zákazníky web přivedl během dnů od spuštění"
          - "Klient si sám spravuje sortiment přes admin"
          - "Doplněný Google Maps profil + článek na Kudy z nudy"
          - "Ručně kódovaný web — rychlý a robustní"
          - "Záchranná operace po roce zmařené práce s jiným webařem"
        meta_title: "Cyklocentrum Březí — záchrana webu cykloservisu od nuly"
        meta_description: "Případová studie: po roce neúspěšné práce s jiným webařem nový web přivedl zákazníky během pár dní od spuštění."
      en:
        title: "Cyklocentrum Březí"
        subtitle: "A rescue project — rebuilt from scratch after a year wasted with another vendor"
        summary: "Bike service and rental website the client needed redone — the previous vendor left them with an unfinished mess. Today the site ranks first in Google for its key local searches."
        description: >-
          Cyklocentrum Březí offers bike service, rentals and sales. After a
          year with another vendor, they were stuck with a half-built
          site that was actively pushing visitors away. I rebuilt the
          replacement from scratch — analysis, structure, copy, SEO,
          product management, and external promotion.
        challenge: >-
          A previous developer worked on the site for a year, and the
          result was damaging the offline reputation the client had
          earned. People were even calling to ask whether the business
          had closed. Salvaging the old site made no sense — rebuilding
          properly was cheaper and safer.
        solution: >-
          I started with a deep look at the business and at Czech and foreign
          competitors. I designed the structure, wrote the copy, and hand-coded the
          site for robustness and speed. Added a product management module (the
          client updates inventory themselves), a Google Maps profile, and a promo
          article on Kudy z nudy. The site now matches the quality of the service
          behind it.
        result: >-
          For searches like "cyklocentrum březí" or "půjčovna kol březí" the site
          ranks first in Google, and its average position across queries rose from
          16.8 to 8.6 (Search Console, 16 May 2025 – 13 Sep 2026). Google therefore
          brings more than half of all traffic — 1,780 of 3,149 visits (Google
          Analytics, 1 Jan – 16 Sep 2026). The client confirms they finally have "a
          presentation they aren't ashamed of". Visitors quickly find what the
          workshop services, what's available to rent, and how to get in touch.
        outcomes:
          - "First new customers arrived within days of launch"
          - "Client manages products themselves via admin"
          - "Google Maps profile and promo article on Kudy z nudy added"
          - "Hand-coded site — fast and robust"
          - "Rescue operation after a wasted year with another vendor"
        meta_title: "Cyklocentrum Březí — bike service website rescued from scratch"
        meta_description: "Case study: after a year wasted with another vendor, the new site brought new customers within days of launch."
      de:
        title: "Cyklocentrum Březí"
        subtitle: "Rettungsprojekt — von Grund auf neu nach einem verlorenen Jahr"
        summary: "Website für Fahrradservice und Verleih, die der Kunde neu brauchte — der vorherige Anbieter hinterließ ein halbfertiges Chaos. Heute steht die Site bei den wichtigsten lokalen Suchen in Google auf Platz eins."
        description: >-
          Cyklocentrum Březí bietet Fahrradservice, Verleih und Verkauf. Nach
          einem Jahr beim vorherigen Anbieter steckten sie mit einer
          halb gebauten Site fest, die Besucher aktiv vertrieb. Ich
          habe den Ersatz komplett neu gebaut — Analyse, Struktur,
          Texte, SEO, Produktverwaltung und externe Promotion.
        challenge: >-
          Der vorherige Entwickler arbeitete ein Jahr — und das
          Ergebnis schadete dem Ruf, den der Kunde offline aufgebaut
          hatte. Manche fragten sogar, ob der Betrieb noch läuft.
          Den alten Auftritt zu retten war sinnlos; ein sauberer
          Neubau war günstiger und sicherer.
        solution: >-
          Ich begann mit einer Analyse des Geschäfts sowie tschechischer und
          internationaler Wettbewerber. Ich habe Struktur, Texte und eigenes Design
          entworfen, alles handgecodet für Robustheit und Tempo. Dazu
          Produktverwaltung (der Kunde aktualisiert das Sortiment selbst),
          Google-Maps-Profil und ein Werbeartikel auf Kudy z nudy. Die Website
          entspricht jetzt der Qualität des Service.
        result: >-
          Bei Suchen wie „cyklocentrum březí" oder „půjčovna kol březí" steht die
          Site in Google auf Platz eins, und die durchschnittliche Position über
          alle Suchanfragen verbesserte sich von 16,8 auf 8,6 (Search Console,
          16.5.2025 – 13.9.2026). Aus Google kommt damit mehr als die Hälfte des
          gesamten Traffics — 1.780 von 3.149 Besuchen (Google Analytics, 1.1. –
          16.9.2026). Der Kunde bestätigt: endlich „eine Präsentation, für die man
          sich nicht schämen muss". Besucher finden schnell, was der Betrieb
          serviciert, was zu mieten ist und wie man Kontakt aufnimmt.
        outcomes:
          - "Erste neue Kunden innerhalb weniger Tage nach Launch"
          - "Kunde verwaltet Produkte selbst über das Admin-Modul"
          - "Google-Maps-Profil und Promo-Artikel auf Kudy z nudy"
          - "Handgecodete Site — schnell und robust"
          - "Rettungsprojekt nach einem verlorenen Jahr beim Vorgänger"
        meta_title: "Cyklocentrum Březí — Fahrradservice-Website neu aufgebaut"
        meta_description: "Case Study: Nach einem verlorenen Jahr beim Vorgänger brachte die neue Site innerhalb weniger Tage neue Kunden."


          chyběly informace o cenách a ošetřeních a v Google se prakticky
          neobjevoval. Pro lékařskou praxi je přitom první dojem klíčový —
          většina pacientů si ordinaci najde právě na webu.
        solution: >-
          Moderní responzivní web s kompletním přehledem ošetření,
          orientačními cenami a FAQ. Doplnil jsem vzdělávací blog se
          třemi úvodními články o péči o chrup, které si klient může
          dál rozšiřovat. Lokální SEO cílí na klíčová slova „zubní
          lékař Hrabětice" a „dentální hygiena Hrabětice".
        result: >-
          Na klíčový lokální dotaz „zubař Hrabětice" je ordinace v Googlu na první
          pozici a z Googlu přichází většina veškeré návštěvnosti — 460 z 524
          návštěv (Google Analytics, 1. 1. – 16. 9. 2026). Web pacientům odpovídá na
          to, na co se dřív museli ptát telefonem: ceny, přehled ošetření, otevírací
          doba a umístění.
        outcomes:
          - "Po spuštění zaznamenán vyšší zájem o ošetření"
          - "Kompletní info o ošetřeních, cenách a FAQ"
          - "Blog s 3 úvodními články, který klient sám rozšiřuje"
          - "Lokální SEO cílené na obec Hrabětice"
          - "Plně responzivní web pro mobil i tablet"
        meta_title: "Zubní Provázek — redesign webu zubní ordinace v Hraběticích"
        meta_description: "Případová studie: redesign webu zubní ordinace s lokálním SEO. Více poptávek po spuštění a pozitivní zpětná vazba pacientů."
      en:
        title: "Zubní Provázek"
        subtitle: "Dental practice redesign with local SEO focus"
        summary: "Redesign for a dental practice in Hrabětice — modern look, full treatment information, a blog, and local SEO. The practice ranks first in Google for \"zubař Hrabětice\"."
        description: >-
          MDDr. Václav Provázek runs a dental practice in Hrabětice.
          The old site looked dated, didn't work on mobile, and left
          patients without basic answers. I rebuilt it with a focus on
          readable information, transparent pricing, FAQ, and local
          search visibility.
        challenge: >-
          The site looked untrustworthy, mobile use was painful, and
          treatment and pricing information was missing. It was also
          essentially invisible in Google. For a medical practice the
          first impression is decisive — most patients find their
          dentist online.
        solution: >-
          A modern responsive site with a full overview of treatments,
          indicative pricing, and FAQ. I added an educational blog with
          three intro articles on dental care that the client can
          extend. Local SEO targets keywords like "dentist Hrabětice"
          and "dental hygiene Hrabětice".
        result: >-
          The practice ranks first in Google for its key local search, "zubař
          Hrabětice", and Google brings most of all traffic — 460 of 524 visits
          (Google Analytics, 1 Jan – 16 Sep 2026). The site answers what patients
          used to have to ask over the phone: prices, treatment overview, opening
          hours and location.
        outcomes:
          - "Higher patient interest recorded after launch"
          - "Complete treatment, pricing and FAQ information"
          - "Blog with 3 starter articles the client extends"
          - "Local SEO targeting the village of Hrabětice"
          - "Fully responsive on mobile and tablet"
        meta_title: "Zubní Provázek — dental practice website redesign"
        meta_description: "Case study: dental practice redesign with local SEO. More enquiries after launch and positive patient feedback."
      de:
        title: "Zubní Provázek"
        subtitle: "Redesign einer Zahnarztpraxis mit Fokus auf lokales SEO"
        summary: "Redesign für eine Zahnarztpraxis in Hrabětice — moderne Optik, vollständige Behandlungsinfos, Blog und lokales SEO. Bei der Suche „zubař Hrabětice\" steht die Praxis in Google auf Platz eins."
        description: >-
          MDDr. Václav Provázek führt eine Zahnarztpraxis in Hrabětice.
          Die alte Website wirkte veraltet, war auf dem Handy
          unbrauchbar und ließ Patienten ohne Antworten auf
          Grundfragen. Ich habe sie neu gebaut — mit Fokus auf lesbare
          Informationen, transparente Preise, FAQ und lokale Sichtbarkeit.
        challenge: >-
          Die Site wirkte unseriös, mobil war sie kaum benutzbar und
          Informationen zu Behandlungen und Preisen fehlten. Bei Google
          war sie praktisch unsichtbar. Für eine Arztpraxis ist der
          erste Eindruck entscheidend — die meisten Patienten finden
          ihre Praxis online.
        solution: >-
          Eine moderne, responsive Site mit vollständiger Behandlungs-
          übersicht, Richtpreisen und FAQ. Ergänzt durch einen Bildungs-
          Blog mit drei Einstiegsartikeln zur Zahnpflege, die der Kunde
          selbst erweitern kann. Lokales SEO zielt auf Begriffe wie
          „Zahnarzt Hrabětice" und „Dentalhygiene Hrabětice".
        result: >-
          Bei der zentralen lokalen Suche „zubař Hrabětice" steht die Praxis in
          Google auf Platz eins, und aus Google kommt der Großteil des gesamten
          Traffics — 460 von 524 Besuchen (Google Analytics, 1.1. – 16.9.2026). Die
          Site beantwortet, was Patienten früher telefonisch fragen mussten: Preise,
          Behandlungsübersicht, Öffnungszeiten und Anfahrt.
        outcomes:
          - "Nach Launch höheres Patienteninteresse verzeichnet"
          - "Vollständige Behandlungs-, Preis- und FAQ-Infos"
          - "Blog mit 3 Einstiegsartikeln, vom Kunden erweiterbar"
          - "Lokales SEO mit Fokus auf Hrabětice"
          - "Voll responsive auf Handy und Tablet"
        meta_title: "Zubní Provázek — Redesign einer Zahnarztpraxis-Website"
        meta_description: "Case Study: Redesign einer Zahnarztpraxis mit lokalem SEO. Mehr Anfragen nach dem Launch und positives Patientenfeedback."


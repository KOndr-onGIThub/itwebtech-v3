          sebevysvětlující.
        solution: >-
          Web je naprogramovaný od základu, bez šablonového CMS. Klient
          má admin pro nemovitosti, poptávky a blog, takže si všechno
          aktualizuje sám. Doplnil jsem rezervační systém přes Reservanto,
          dva úvodní blogové články a stockovou fotku tam, kde
          chyběly vlastní snímky. Branding, klíčová slova a SEO struktura

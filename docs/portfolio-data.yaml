# Portfolio dataset — OND-59 / OND-62
# Vytvořeno: 2026-05-06 (Content Writer)
# Zdroje: ondraweb.cz/projekty (preferováno) + itwebtech.cz/projects
# 24 projektů po deduplikaci: 14 webů, 5 aplikací, 5 ostatní
# OND-282: tři z nich (logo-realitacky, video-pitbike-akademie, animace-delejme)
# mají `published_at: null` — v datasetu zůstávají, na web se nedostanou.
# Publikovaných je tedy 21: 14 webů, 5 aplikací, 2 ostatní.
# Schéma odpovídá návrhu z OND-60 (portfolio_projects + *_translations + *_screenshots)
# Engineer ve fázi 2: stáhne obrázky z `screenshots_source[].url`, uloží do
# `resources/img/projects/{slug}/...`, pole `path` v DB doplní podle vlastní
# konvence pojmenování.
#
# Poznámky k ověření:
#   - live_url u všech veřejných webů uvedeno přesně tak, jak je publikuje
#     ondraweb.cz / itwebtech.cz, tj. autorův vlastní portfoliový web.
#     Tato shoda byla považována za jednoznačné ověření (URL i screenshoty
#     pocházejí z téhož zdroje).
#   - U interních aplikací (Toyota Kolín) je live_url null — nejsou veřejné.
#   - U YOLK je live_url null — agenturní práce na vícero portálech;
#     konkrétní URL (unica.cz, reproclinic.com) zmíněna v textu.
#   - U Elektro Srnák je live_url null — od poloviny 2025 web bez hostingu
#     (uvedeno na zdrojové stránce).

projects:


        result: >-
          Klientka má web, který jí slouží 24/7 a nestojí ji nic
          měsíčního. Odkazuje na něj v komunikaci, sama přidává
          nemovitosti i články. V referenci píše o profesionálním
          a zároveň lidském přístupu a o tom, že jsem skutečně poslouchal,

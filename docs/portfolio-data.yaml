          - "Logo und Visual Identity mit der Site entwickelt"
          - "Fachartikel für Qualität und SEO"
          - "Voll responsive — Handy-Foto so gut wie Desktop"
          - "Marke gestärkt gegenüber Template-Wettbewerb"
        meta_title: "Střechy Zajíc — Website für Zimmerei und Bedachung"
        meta_description: "Case Study: Website für Střechy Zajíc — Zimmerei und Bedachung mit Referenzgalerie, Logo und Content-Optimierung."


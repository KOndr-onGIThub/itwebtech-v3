          a sdělením, které je čitelné i bez zvuku. Tempo a střih
          jsou postavené pro mobilní obrazovku — žádné drobné texty,
          žádné spletité scény.
        result: >-
          Klient má formát, který sedí facebookovému publiku a rozšiřuje povědomí
          o akademii bez drahé videoprodukce. Pro další sezóny se dá použít znovu

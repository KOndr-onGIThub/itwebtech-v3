          Die alte Site war veraltet, schlecht organisiert und nicht
          mobiltauglich. Für einen Campingplatz, bei dem unterwegs und
          am Handy entschieden wird, bedeutete das verlorene Buchungen.
          Die neue Site musste die Unterkünfte klar zeigen, Buchung in
          wenige Taps bringen und die Familien-Atmosphäre bewahren.
        solution: >-
          Eine moderne One-Page-Site mit Mobile-First-Denken. Klare
          Unterkunftsinformationen, einfacher Buchungsablauf, Fotos
          passend zur Atmosphäre. Dazu ein Logo, das es vorher nicht
          gab. Ladezeiten waren wichtig für den ersten Eindruck am
          Handy.
        result: >-
          Die Inhaberin berichtet seit dem Launch von höherem Interesse
          und sagt: „Der moderne Auftritt schafft Vertrauen und einen
          professionellen Eindruck." Die Site arbeitet als stiller

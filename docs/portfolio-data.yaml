        title: "Střechy Zajíc"
        subtitle: "Zimmerei, Bedachung und Maurerei in einem fokussierten Auftritt"
        summary: "Website für einen Zimmerer- und Dachdeckerbetrieb — Projektgalerie, Leistungsübersicht, Logo und Fachartikel. Hier verkauft sich Handwerk, das man sieht."
        description: >-
          Střechy Zajíc machen Zimmerei, Bedachung und Maurerarbeiten —
          ein Handwerk, bei dem Kunden nach Referenzen und Fotos wählen.
          Die Website musste dem entsprechen: eine Galerie fertiger
          Aufträge, klare Leistungsbeschreibungen und ein Logo, das
          die Marke stärkt.
        challenge: >-
          Der Kunde brauchte eine Präsentation, die seine Qualität
          überzeugender belegt als ein paar Facebook-Fotos. Die Leistungen
          (Dachsanierungen, Zimmerei, Bauarbeiten) mussten strukturiert,
          eine Referenzgalerie aufgebaut und Fachartikel ergänzt werden,
          die SEO und Vertrauen stützen.
        solution: >-
          Eine responsive Site mit Leistungskatalog, detaillierten
          Beschreibungen und Fotogalerie fertiger Projekte. Dazu Logo,
          Content-Optimierung und Fachartikel. Die Site funktioniert
          auf Desktop genauso gut wie auf dem Handy, mit dem Handwerker
          unterwegs „den Typ noch mal" prüfen.
        result: >-
          Der Kunde hat einen würdigen Auftritt, der das Handwerk
          repräsentiert, statt nach billiger Bauseite auszusehen.
          Aufträge kommen über die Referenzgalerie, die Site stützt
          lokale Suche und die Marke steht stärker gegenüber Template-
          Wettbewerbern.
        outcomes:

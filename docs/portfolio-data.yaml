    translations:
      cs:
        title: PitArena
        subtitle: "Od nuly ke značce, webu a online prodeji programů"
        summary: "Značka, web a online prodej pro nové motokrosové centrum. Web dnes nese programy, poukazy na jízdu i registrace na závody."
        description: >-
          PitArena startovala bez webu, brandu i bez první zakázky. Postavil jsem
          kompletní digitální základ — značku, web s nabídkou programů, online
          prodejem poukazů a registracemi na závody. Od roku 2023 web dál rozvíjím
          spolu s majitelem.
        challenge: >-
          Klient otevíral nové motokrosové centrum v Česku. Žádný web,
          žádná značka, nula obsazenosti. Bylo potřeba vybudovat důvěru
          ještě dřív, než se PitArena fyzicky otevřela, a zařídit, aby si
          lidé tréninky mohli objednat 24/7 bez telefonátů a e-mailů.
        solution: >-
          Navrhl jsem značku a postavil na míru web s online prodejem poukazů na
          jízdu, nabídkou programů (akademie, zájmový kroužek, kempy a MX
          soustředění) a registracemi na závody YCF Cup. SEO a obsahové články cílí
          na lidi, kteří hledají „motokrosový kemp" nebo „pitbike trénink". Doplňuje
          to správa sociálních sítí a propojení s merchem.
        result: >-
          Z Googlu si web řekne o víc než 15 000 návštěv za 16 měsíců (Search
          Console, 16. 5. 2025 – 13. 9. 2026: 15 472 prokliků při 288 925
          zobrazeních) a průměrná pozice ve vyhledávání se za tu dobu zvedla z 10,3
          na 7,6. Zájemce si sám najde program, koupí poukaz na jízdu nebo se
          přihlásí na závod, bez telefonátu majiteli. Vedle toho web nese e-shop,
          půjčovnu, servis a blog. Dlouhodobá spolupráce pokračuje dodnes.
        outcomes:
          - "Spuštění značky i webu od nuly za jeden ucelený projekt"
          - "Online prodej poukazů a registrace na závody bez ručního zásahu"
          - "Programy, půjčovna, servis a e-shop na jednom webu"
          - "SEO a obsahové články cílené na motokrosové kempy a pitbike tréninky"
          - "Web a brand drží konzistentní tvář napříč webem, sociálními sítěmi a merchem"
        meta_title: "PitArena — web, rezervace a brand pro motokrosové centrum"
        meta_description: "Případová studie: značka, web a online prodej pro PitArenu — programy, poukazy na jízdu a registrace na závody na jednom webu."
      en:
        title: PitArena
        subtitle: "From zero to a brand, a website and online sales"
        summary: "Brand, website and online sales for a brand-new motocross centre. The site now carries programmes, ride vouchers and race registrations."
        description: >-
          PitArena launched with no website, no brand, and no customers. I built the
          full digital foundation — identity, a custom website with programme
          listings, online voucher sales and race registrations. The site has been
          growing alongside the owner since 2023.
        challenge: >-
          The client was opening a new motocross training centre in Czechia. No web
          presence, no brand, zero occupancy. Trust had to be built before PitArena
          physically opened, and let people book training 24/7 — without phone calls
          or e-mails.
        solution: >-
          I designed the brand and built a custom website with online ride-voucher
          sales, programme listings (academy, youth club, camps and MX training
          weeks) and race registrations for the YCF Cup. SEO and content articles
          target people searching for "motocross camp" or "pitbike training". Social
          media management and merch integration round it out.
        result: >-
          The site pulls more than 15,000 visits from Google over 16 months (Search
          Console, 16 May 2025 – 13 Sep 2026: 15,472 clicks on 288,925 impressions),
          and its average search position rose from 10.3 to 7.6 over that period. A
          visitor finds a programme, buys a ride voucher or signs up for a race
          without calling the owner. Alongside that it carries the online shop,
          rentals, service and a blog. The long-term partnership continues today.
        outcomes:
          - "Brand and website launched from scratch as a single project"
          - "Online voucher sales and race registrations run hands-off"
          - "Programmes, rentals, service and online shop on one site"
          - "SEO and content aimed at motocross camps and pitbike training"
          - "Consistent identity across website, social media and merch"
        meta_title: "PitArena — website, booking & brand for a motocross centre"
        meta_description: "Case study: brand, website and online sales for PitArena — programmes, ride vouchers and race registrations on one site."
      de:
        title: PitArena
        subtitle: "Von Null zu Marke, Website und Online-Verkauf"
        summary: "Marke, Website und Online-Verkauf für ein neues Motocross-Zentrum. Die Site trägt heute Programme, Fahrgutscheine und Rennanmeldungen."
        description: >-
          PitArena startete ohne Website, ohne Marke und ohne Kunden. Ich habe die
          gesamte digitale Grundlage gebaut — Identität, eine maßgeschneiderte
          Website mit Programmübersicht, Online-Gutscheinverkauf und
          Rennanmeldungen. Seit 2023 entwickle ich die Site gemeinsam mit dem
          Inhaber weiter.
        challenge: >-
          Der Kunde eröffnete ein neues Motocross-Trainingszentrum in
          Tschechien. Keine Website, keine Marke, null Auslastung. Vertrauen
          musste entstehen, bevor PitArena physisch öffnete — und Menschen
          mussten 24/7 buchen können, ohne Anrufe oder E-Mails.
        solution: >-
          Ich habe die Marke entworfen und eine individuelle Website gebaut — mit
          Online-Verkauf von Fahrgutscheinen, Programmübersicht (Akademie,
          Jugendclub, Camps und MX-Trainingswochen) und Anmeldungen zum YCF Cup.
          SEO- und Content-Artikel zielen auf Suchen wie „Motocross-Camp" oder
          „Pitbike-Training". Social-Media-Betreuung und Merch-Anbindung runden
          alles ab.
        result: >-
          Aus Google holt die Site in 16 Monaten mehr als 15.000 Besuche (Search
          Console, 16.5.2025 – 13.9.2026: 15.472 Klicks bei 288.925 Impressionen),
          und die durchschnittliche Suchposition verbesserte sich in dieser Zeit von
          10,3 auf 7,6. Interessenten finden ein Programm, kaufen einen
          Fahrgutschein oder melden sich zum Rennen an, ohne beim Inhaber anzurufen.
          Daneben trägt sie Onlineshop, Verleih, Service und Blog. Die langfristige
          Zusammenarbeit läuft bis heute.
        outcomes:
          - "Marke und Website von Null als ein einziges Projekt"
          - "Online-Gutscheinverkauf und Rennanmeldungen ohne Handarbeit"
          - "Programme, Verleih, Service und Onlineshop auf einer Site"
          - "SEO und Content für Motocross-Camps und Pitbike-Training"
          - "Konsistente Identität auf Website, Social Media und Merch"
        meta_title: "PitArena — Website, Buchung & Marke für ein Motocross-Zentrum"
        meta_description: "Case Study: Marke, Website und Online-Verkauf für PitArena — Programme, Fahrgutscheine und Rennanmeldungen auf einer Site."


        subtitle: "The campsite's calm atmosphere translated to the web"
        summary: "Redesign for a family campsite — a single-page website with clear accommodation, booking and the atmosphere of a place worth returning to."
        description: >-
          Autokemp Veselka is a family campsite where the real product
          is atmosphere. The redesign had to carry that atmosphere onto
          the web and make the booking decision easy — no fussy
          navigation, no awkward forms.
        challenge: >-
          The original site was outdated, poorly organised, and not
          mobile-ready. For a campsite where people typically decide
          while travelling or on a phone, that meant lost bookings.
          The site needed to show accommodation clearly, make booking
          a few taps away, and preserve the family-camp atmosphere.

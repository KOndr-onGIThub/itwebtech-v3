        summary: "Logistická aplikace pro Toyotu Kolín. Řeší krizovky s chybějícími díly dřív, než stojí montážní linka."
        description: >-
          HCMS je interní webová aplikace, která logistickému týmu Toyoty
          dává jasné instrukce při náhlém nedostatku dílů na lince.
          Operátoři si přes tablet potvrzují kroky a systém na pozadí
          udržuje historii zásahů. Postaveno z analýzy reálných procesů
          na hale, ne z papírové specifikace.
        challenge: >-
          Když výrobní lince chybí díl, počítá se každá minuta — stojící
          linka znamená přímou ztrátu. Logistika do té doby řešila krizovky
          z hlavy a předávala instrukce ústně. Bylo potřeba systém, který
          v reálném čase ukáže, kde díl je, kdo ho má dovézt a v jakém
          pořadí pracovníci postupují, aby zásah proběhl spolehlivě i pod
          tlakem.
        solution: >-
          Po analýze procesů přímo na hale jsem zmapoval, co všechno se při
          výpadku dílu děje a kdo v tom hraje jakou roli, a z toho postavil
          webovou aplikaci — tabletové rozhraní pro operátory, desktopový přehled
          pro vedoucí. Aplikace vede člověka krok za krokem, eviduje stav, udržuje
          historii a umí předávat úkoly mezi směnami. Zkušenost z 18 let přímo v
          Toyotě se promítla do detailů, které se z venku nedají odhadnout.
        result: >-
          Klient uvádí roční úsporu nejméně 3 milionů Kč — odpovídající
          jednomu pracovníkovi na směnu napříč třemi směnami. V obdobích
          modelových přechodů, kdy je odchylek nejvíc, se podle něj
          úspora násobí. Systém je v provozu dodnes a stal se referenční
          ukázkou, jak vypadá aplikace navržená lidmi, kteří provoz
          opravdu znají.
        outcomes:
          - "Klient uvádí úsporu nejméně 3 mil. Kč ročně"
          - "Při výkyvech modelových přechodů úspora podle klienta násobně roste"
          - "Tabletové rozhraní pro práci přímo na hale"
          - "Doménový model + use cases postavené z reálné práce v Toyotě"
          - "Provoz nepřetržitě od 2021"
        meta_title: "HCMS pro Toyotu Kolín — systém, který drží linku v chodu"
        meta_description: "Případová studie: webová aplikace pro logistický tým Toyoty. Klient uvádí roční úsporu nejméně 3 mil. Kč. Provoz od 2021."
      en:
        title: "HCMS — production information system"
        subtitle: "An app that keeps the assembly line moving"
        summary: "Logistics application for Toyota Kolín. Resolves part-shortage emergencies before the assembly line stops."
        description: >-
          HCMS is an internal web application that gives Toyota's logistics
          team clear instructions when parts run short on the line.
          Operators confirm steps on a tablet, the system keeps a full
          history. Built from real process analysis on the shop floor —
          not from a paper spec.
        challenge: >-
          When an assembly line runs out of a part, every minute counts —
          a stopped line is a direct loss. Logistics used to handle
          emergencies from memory and pass instructions verbally. The
          team needed a system that shows in real time where a part is,
          who delivers it, and in what order people proceed, so the
          response works even under pressure.
        solution: >-
          After analysing real processes on the shop floor, I built the
          domain model, use case map, and a web application with a tablet
          interface for operators and a desktop view for shift leaders.
          The app walks people through each step, tracks state, keeps
          history, and hands tasks across shifts. Eighteen years of
          first-hand Toyota experience shaped details an outside vendor
          would never spot.
        result: >-
          The client reports annual savings of at least 3 million CZK —
          equivalent to one full-time worker per shift across three shifts.
          During model-change periods, when abnormalities peak, savings
          reportedly multiply further. The system has been in production
          since 2021 and serves as a reference for what software designed
          by people who actually know the operation looks like.
        outcomes:
          - "Client reports savings of at least 3 million CZK per year"
          - "Savings reportedly multiply during model-change peaks"
          - "Tablet interface designed for shop-floor use"
          - "Domain model and use cases built from real Toyota practice"
          - "Continuously in production since 2021"
        meta_title: "HCMS for Toyota Kolín — keeping the assembly line moving"
        meta_description: "Case study: web app for Toyota's logistics team. Client reports at least 3 million CZK saved per year. In production since 2021."
      de:
        title: "HCMS — Produktions-Informationssystem"
        subtitle: "Eine App, die das Montageband am Laufen hält"
        summary: "Logistikanwendung für Toyota Kolín. Löst Engpässe bei Teilen, bevor das Montageband stehenbleibt."
        description: >-
          HCMS ist eine interne Webanwendung, die dem Logistikteam von
          Toyota klare Anweisungen liefert, wenn Teile am Band knapp
          werden. Operatoren bestätigen Schritte am Tablet, das System
          führt die komplette Historie. Entstanden aus echter Prozess-
          analyse in der Werkshalle — nicht aus einer Papier-Spec.
        challenge: >-
          Fehlt ein Teil am Band, zählt jede Minute — Stillstand bedeutet
          direkten Verlust. Bisher hat die Logistik Notfälle aus dem
          Gedächtnis gelöst und Anweisungen mündlich weitergegeben.
          Gesucht war ein System, das in Echtzeit zeigt, wo das Teil
          liegt, wer es liefert und in welcher Reihenfolge Mitarbeiter
          arbeiten, damit die Reaktion auch unter Druck zuverlässig läuft.
        solution: >-
          Nach Analyse realer Prozesse in der Werkshalle entstand das
          Domänenmodell, eine Use-Case-Karte sowie eine Webanwendung mit
          Tablet-Oberfläche für Operatoren und Desktop-Ansicht für
          Schichtleiter. Die App führt Schritt für Schritt durch den
          Ablauf, verfolgt den Status, hält die Historie und gibt
          Aufgaben zwischen Schichten weiter. 18 Jahre Toyota-Praxis
          flossen in Details, die von außen niemand sieht.
        result: >-
          Der Kunde nennt eine jährliche Einsparung von mindestens
          3 Millionen CZK — das entspricht einer Vollzeitkraft pro
          Schicht über drei Schichten. In Modellwechsel-Phasen, wenn
          Abweichungen ihren Höhepunkt erreichen, vervielfachen sich
          die Einsparungen laut Kunde. Das System läuft seit 2021 und
          ist Referenz dafür, wie Software aussieht, wenn sie von
          Menschen mit echter Werkserfahrung entworfen wird.
        outcomes:
          - "Kunde nennt Einsparung von mindestens 3 Mio. CZK pro Jahr"
          - "Einsparung vervielfacht sich laut Kunde bei Modellwechseln"
          - "Tablet-Oberfläche für den Einsatz direkt in der Werkshalle"
          - "Domänenmodell und Use Cases aus realer Toyota-Praxis"
          - "Durchgehend in Produktion seit 2021"
        meta_title: "HCMS für Toyota Kolín — Montageband ohne Stillstand"
        meta_description: "Case Study: Webanwendung für das Logistikteam von Toyota. Kunde nennt mindestens 3 Mio. CZK Einsparung pro Jahr. Produktiv seit 2021."


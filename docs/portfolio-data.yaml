        title: "Autokemp Veselka"
        subtitle: "Die ruhige Atmosphäre des Camps übertragen aufs Web"
        summary: "Redesign für einen Familien-Campingplatz — eine One-Page-Site mit klarer Unterkunftsinfo, Buchung und der Atmosphäre eines Ortes, an den man zurückkehren möchte."
        description: >-
          Autokemp Veselka ist ein Familien-Campingplatz, dessen

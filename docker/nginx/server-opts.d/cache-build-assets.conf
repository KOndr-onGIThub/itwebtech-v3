# OND-123 — long-cache headers pro Vite hash-suffixované assety.
#
# Vite zapisuje content-hash do názvu souboru (např.
# `app-BFQCkCn0.js`, `address_data-Bco1Xcrb.avif`), takže nová verze = nový
# soubor → můžeme servírovat s `immutable` a max-age 1 rok bez rizika
# zastaralého obsahu.
#
# Bez tohoto snippetu PSI mobile audit „Efektivní platnost mezipaměti"
# failoval pro first-party assets (Cache-Control: None / krátký default).
# Plán OND-99 §9.1, parent OND-115 (P2 fix).
#
# serversideup/php-fpm-nginx auto-includuje `/etc/nginx/server-opts.d/*.conf`
# do server kontextu (default site).

location ^~ /build/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
}

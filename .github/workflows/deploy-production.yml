# OND-459: nasazení produkce (ondraweb.cz + itwebtech.cz) na hosting Webglobe.
#
# Spouští se samo po každém sloučení do `main`. Ručně jde spustit v záložce
# Actions → „Nasazení produkce (Webglobe)“ → Run workflow, buď jako běžné
# nasazení, nebo jako návrat na předchozí verzi. Návod: docs/deploy-production.md.
#
# Build běží tady na runneru, na server jde hotová aplikace do nového
# adresáře releases/<id>. Migrace, seedery, optimize a zkouška stránek
# proběhnou v novém release a web se přepne až potom
# (scripts/deploy/remote-deploy.sh). Když cokoli selže, běží dál předchozí verze.
#
# Přihlašovací shell na Webglobe je fish, ne bash (OND-461). Každý příkaz na
# serveru proto jde přes `rbash` = `ssh webglobe bash -s` se skriptem na stdin.

name: Nasazení produkce (Webglobe)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Co udělat
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

# Dvě nasazení nikdy neběží přes sebe. Další počká, až doběhne předchozí.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

# Výchozí hodnoty změřil CEO na serveru 29. 9. (OND-461). Variables je smí
# přebít, ale nemusí existovat.
env:
  APP_DIR: ${{ vars.WEBGLOBE_APP_DIR || '/home/html/ondraweb.cz/app' }}
  WEB_ROOT: ${{ vars.WEBGLOBE_WEB_ROOT || '/home/html/ondraweb.cz/public_html' }}
  WEB_URL: ${{ vars.WEBGLOBE_WEB_URL || 'https://ondraweb.cz' }}
  PHP_BIN: ${{ vars.WEBGLOBE_PHP_BIN || 'php8.4' }}
  KEEP_RELEASES: '5'

jobs:
  deploy:
    name: ${{ inputs.action == 'rollback' && 'Návrat na předchozí verzi' || 'Build a nasazení' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.action || 'deploy' }}
      # Adresa serveru není tajná, proto je přímo tady. Náš server (níž)
      # pustí spojení jen na přesně tenhle název a port.
      SSH_HOST: dw142.webglobe.com
      SSH_USER: ${{ secrets.WEBGLOBE_SSH_USER || vars.WEBGLOBE_SSH_USER || 'ssh-608671' }}
      SSH_PORT: ${{ secrets.WEBGLOBE_SSH_PORT || vars.WEBGLOBE_SSH_PORT || '20001' }}
      SSH_KEY: ${{ secrets.WEBGLOBE_SSH_KEY }}
      SSHPASS: ${{ secrets.WEBGLOBE_SSH_PASSWORD }}
      SSH_KNOWN_HOSTS: ${{ secrets.WEBGLOBE_SSH_KNOWN_HOSTS }}
      # Webglobe zahazuje spojení z části serverů na internetu, včetně GitHubu
      # (29. 9. timeout na všech portech, i na 443). Spojení proto jde přes náš
      # server, který se na Webglobe dostane přes IPv6. Klíč smí na našem
      # serveru jen otevřít spojení na dw142.webglobe.com:20001, nic jiného
      # (authorized_keys: permitopen). Otisk JUMP_HOST_KEY ověřen z runneru
      # GitHubu 29. 9. (OND-461).
      JUMP_KEY: ${{ secrets.DEPLOY_JUMP_KEY }}
      JUMP_HOST: 46.224.218.19
      JUMP_USER: paperclip
      JUMP_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG9Cw4EBBl7uaUBqg7kUqYqZYLUrMEWh8PZ4qtxRBpLR

    steps:
      # Produkční .env žije jen na serveru (app/shared/.env), workflow ji
      # nenahrává ani nepřepisuje. Secret PRODUCTION_ENV se nepoužívá (OND-461).
      - name: Kontrola nastavení (GitHub Secrets)
        run: |
          missing=""
          [ -n "$SSH_KEY$SSHPASS" ] || missing="$missing WEBGLOBE_SSH_PASSWORD(nebo WEBGLOBE_SSH_KEY)"
          [ -n "$JUMP_KEY" ] || missing="$missing DEPLOY_JUMP_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Chybí GitHub Secrets:$missing. Doplň je podle docs/deploy-production.md (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Stažení kódu
        if: env.MODE == 'deploy'
        uses: actions/checkout@v4

      - name: PHP 8.4 + Composer
        if: env.MODE == 'deploy'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, bcmath, exif, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Composer závislosti (bez dev)
        if: env.MODE == 'deploy'
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Node 22
        if: env.MODE == 'deploy'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build CSS a JS (Vite)
        if: env.MODE == 'deploy'
        run: |
          # --include=dev: Vite a Tailwind jsou v devDependencies. Při
          # NODE_ENV=production by je `npm ci` jinak tiše vynechal.
          npm ci --include=dev --no-audit --no-fund
          npm run build
          test -f public/build/manifest.json || { echo "::error::Build nevytvořil public/build/manifest.json."; exit 1; }

      - name: Připojení k serveru
        run: |
          # Mezery a konce řádků navíc z vloženého Secretu by přihlášení rozbily.
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')"
          mkdir -p ~/.ssh ~/bin
          chmod 700 ~/.ssh
          printf '%s\n' "$JUMP_KEY" > ~/.ssh/jump_key
          chmod 600 ~/.ssh/jump_key
          echo "$JUMP_HOST $JUMP_HOST_KEY" > ~/.ssh/known_hosts_jump
          # BatchMode u našeho serveru: když klíč neprojde, nic se nezkouší heslem.
          {
            echo "Host jump"
            echo "  HostName $JUMP_HOST"
            echo "  User $JUMP_USER"
            echo "  IdentityFile ~/.ssh/jump_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts_jump"
            echo "  StrictHostKeyChecking yes"
            echo "  ConnectTimeout 20"
            echo "Host webglobe"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  ProxyJump jump"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          echo "Připojuji se na $SSH_HOST:$SSH_PORT přes náš server $JUMP_HOST (jméno má ${#SSH_USER} znaků)."

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "  StrictHostKeyChecking yes" >> ~/.ssh/config
          else
            echo "  StrictHostKeyChecking accept-new" >> ~/.ssh/config
          fi

          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            { echo "  IdentityFile ~/.ssh/deploy_key"; echo "  IdentitiesOnly yes"; } >> ~/.ssh/config
            printf '#!/bin/sh\nexec ssh "$@"\n' > ~/bin/wssh
          else
            if ! command -v sshpass >/dev/null; then sudo apt-get install -y -qq sshpass >/dev/null; fi
            { echo "  PreferredAuthentications password,keyboard-interactive"; echo "  PubkeyAuthentication no"; } >> ~/.ssh/config
            # Heslo čte sshpass z proměnné SSHPASS, do příkazové řádky se nedostane.
            printf '#!/bin/sh\nexec sshpass -e ssh "$@"\n' > ~/bin/wssh
          fi
          # rbash: skript ze stdin spustí na serveru bash. Přihlašovací shell
          # (fish) dostane jen `bash -s`, žádnou syntaxi, které by nerozuměl.
          printf '#!/bin/sh\nexec wssh webglobe bash -s\n' > ~/bin/rbash
          chmod 700 ~/bin/wssh ~/bin/rbash
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"

          # shellcheck disable=SC2016 # $(…) a $HOME se mají rozvinout až na serveru
          if ! rbash <<'EOF'
          echo "Připojeno jako $(whoami) na $(hostname), domovský adresář $HOME, bash $BASH_VERSION"
          command -v rsync >/dev/null || { echo "Na serveru chybí rsync." >&2; exit 1; }
          EOF
          then
            echo "::error::Nepodařilo se připojit přes náš server $JUMP_HOST na $SSH_HOST:$SSH_PORT jako $SSH_USER. Connection timed out nebo open failed = SSH na Webglobe je vypnuté (hodinová WebSSH vypršela, je potřeba Permanentní SSH konzole). Permission denied = špatné heslo ve WEBGLOBE_SSH_PASSWORD. Unknown command: bash = na serveru chybí bash. Viz docs/deploy-production.md."
            exit 1
          fi

      - name: Nahrání nového release
        if: env.MODE == 'deploy'
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          DEST="$APP_DIR/releases/$RELEASE"
          echo "mkdir -p '$DEST'" | rbash

          # Co na server nejde: sdílené věci (storage, .env), vývojářské
          # soubory a node_modules (build už je v public/build).
          cat > /tmp/deploy-exclude <<'EOF'
          /.git/
          /.github/
          /.devcontainer/
          /node_modules/
          /tests/
          /reference/
          /storage/
          /.env
          /.env.*
          /public/storage
          /public/hot
          /.phpunit.cache/
          EOF
          sed -i 's/^ *//' /tmp/deploy-exclude

          # --link-dest: soubory beze změny proti běžící verzi se na serveru
          # jen nalinkují, nepřenášejí se ani nezabírají místo navíc. Vzdálený
          # `rsync --server …` spustí fish bez potíží, jsou to jen argumenty.
          rsync -a --stats --exclude-from=/tmp/deploy-exclude \
            --link-dest=../../current/ -e wssh ./ "webglobe:$DEST/"

      - name: Migrace, optimize, zkouška a přepnutí webu
        if: env.MODE == 'deploy'
        run: |
          rbash <<EOF
          export APP_DIR='$APP_DIR' WEB_ROOT='$WEB_ROOT' WEB_URL='$WEB_URL' PHP_BIN='$PHP_BIN' KEEP_RELEASES='$KEEP_RELEASES' RELEASE='$RELEASE'
          exec bash '$APP_DIR/releases/$RELEASE/scripts/deploy/remote-deploy.sh' deploy </dev/null
          EOF
          {
            echo "### Nasazeno"
            echo "- release: \`$RELEASE\` (commit \`${GITHUB_SHA::7}\`)"
            echo "- návrat zpět: Actions → Nasazení produkce (Webglobe) → Run workflow → \`rollback\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Návrat na předchozí verzi
        if: env.MODE == 'rollback'
        run: |
          rbash <<EOF
          export APP_DIR='$APP_DIR'
          exec bash '$APP_DIR/current/scripts/deploy/remote-deploy.sh' rollback </dev/null
          EOF
          echo "### Web vrácen na předchozí release" >> "$GITHUB_STEP_SUMMARY"
